<!DOCTYPE html>
<!--
  orders.html — Orders page of GizmoHub.
  Header and footer are drawn by js/app.js; page logic is in js/orders.js.
  Business rules are enforced by the Java backend; this page only shows results/errors.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders · GizmoHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="orders">
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="container page">
      <div class="page-head"><h1>Order history</h1></div>
      <div class="alert" id="orders-message" hidden role="alert"></div>
      <div id="order-list"></div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/app.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
