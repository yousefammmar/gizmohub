<!DOCTYPE html>
<!--
  checkout.html — Checkout page of GizmoHub.
  Header and footer are drawn by js/app.js; page logic is in js/checkout.js.
  Business rules are enforced by the Java backend; this page only shows results/errors.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · GizmoHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="container page">
      <h1>Checkout</h1>
      <div class="alert" id="checkout-message" hidden role="alert"></div>
      <div class="two-col">
        <section class="card">
          <h2>Shipping information</h2>
          <form id="checkout-form" novalidate>
            <div class="field">
              <label for="checkout-address">Shipping address</label>
              <textarea id="checkout-address" name="shippingAddress" autocomplete="street-address" required></textarea>
              <p class="hint">10–200 characters (ORDER-03).</p>
            </div>
            <div class="field">
              <label for="checkout-phone">Phone number</label>
              <input id="checkout-phone" name="phone" type="tel" autocomplete="tel" placeholder="+962791234567" required>
              <p class="hint">Digits only, optional leading +, 10–15 digits (ORDER-04).</p>
            </div>
            <div class="alert alert-info">Payment is simulated: no card details are collected. You pay on delivery.</div>
            <!-- Button: placeOrder() -> POST /api/orders -> confirmation, or ORDER-02..05 error. -->
            <button class="btn btn-primary btn-block" type="submit" id="place-order">Place order</button>
          </form>
        </section>
        <aside class="card" id="checkout-summary"></aside>
      </div>
      <section class="card" id="order-confirmation" hidden></section>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/app.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
