<!DOCTYPE html>
<!--
  cart.html — Cart page of GizmoHub.
  Header and footer are drawn by js/app.js; page logic is in js/cart.js.
  Business rules are enforced by the Java backend; this page only shows results/errors.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart · GizmoHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="container page">
      <div class="page-head"><h1>Your cart</h1><span class="muted" id="cart-count"></span></div>
      <div class="alert" id="cart-message" hidden role="alert"></div>
      <div class="two-col">
        <section class="card" id="cart-items"></section>
        <aside class="card" id="cart-summary"></aside>
      </div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
