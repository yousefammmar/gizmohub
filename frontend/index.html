<!DOCTYPE html>
<!--
  index.html — Home page of GizmoHub.
  Header and footer are drawn by js/app.js; page logic is in js/home.js.
  Business rules are enforced by the Java backend; this page only shows results/errors.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · GizmoHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="container page">
      <section class="hero">
        <div>
          <span class="badge badge-deal">Free shipping from $50</span>
          <h1>Gadgets that just work.</h1>
          <p>Laptops, phones, audio, wearables and gaming gear — checked, in stock, and shipped fast.</p>
          <div class="actions-row">
            <!-- Button: opens the full catalog (plain link, no script). -->
            <a class="btn btn-primary" href="products.html">Shop all products</a>
            <a class="btn btn-outline" href="products.html?category=AUDIO">Browse audio</a>
          </div>
        </div>
        <div class="hero-art" id="hero-art"></div>
      </section>

      <section class="perks" id="perks"></section>

      <h2>Shop by category</h2>
      <section class="category-tiles" id="category-tiles"></section>

      <div class="page-head"><h2>Featured</h2><a href="products.html">View all</a></div>
      <section class="product-grid" id="featured-grid" aria-live="polite"></section>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
