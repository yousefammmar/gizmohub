<!DOCTYPE html>
<!--
  register.html — Register page of GizmoHub.
  Header and footer are drawn by js/app.js; page logic is in js/register.js.
  Business rules are enforced by the Java backend; this page only shows results/errors.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · GizmoHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <header class="site-header" id="site-header"></header>
  <main>
    <div class="container page">
      <div class="auth-wrap card">
        <h1>Create account</h1>
        <p class="muted">Password must be 8–20 characters.</p>
        <div class="alert" id="register-message" hidden role="alert"></div>
        <form id="register-form" novalidate>
          <div class="field">
            <label for="register-email">Email</label>
            <input id="register-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="register-password">Password</label>
            <input id="register-password" name="password" type="password" autocomplete="new-password" required>
            <p class="hint">Between 8 and 20 characters (AUTH-03).</p>
          </div>
          <div class="field">
            <label for="register-confirm">Confirm password</label>
            <input id="register-confirm" name="confirmPassword" type="password" autocomplete="new-password" required>
          </div>
          <!-- Button: submits -> handleRegister() -> POST /api/auth/register -> goes to login, or shows AUTH-01..04 error. -->
          <button class="btn btn-primary btn-block" type="submit" id="register-submit">Create account</button>
        </form>
        <p class="muted">Already registered? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/app.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
