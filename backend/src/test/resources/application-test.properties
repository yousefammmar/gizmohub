# Test profile: separate in-memory database so tests never touch the dev database.
spring.datasource.url=jdbc:h2:mem:gizmohub-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.web.resources.static-locations=classpath:/no-static/
logging.level.root=WARN
