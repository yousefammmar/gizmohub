# ---------- GizmoHub local configuration ----------
server.port=8080

# In-memory H2 database: recreated (and re-seeded) on every start -> repeatable manual tests.
spring.datasource.url=jdbc:h2:mem:gizmohub;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 web console for inspecting tables: http://localhost:8080/h2-console  (JDBC URL above, user sa, no password)
spring.h2.console.enabled=true

# Serve the plain HTML/CSS/JS frontend from ../frontend (same origin -> session cookie just works)
spring.web.resources.static-locations=file:../frontend/

# Session cookie hardening (AUTH / safe session handling)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
